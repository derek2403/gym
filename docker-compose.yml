services:
  gym:
    build: .
    container_name: gym-app
    ports:
      - "3000:3000"
    volumes:
      - gym-data:/app/data
    environment:
      - DATABASE_URL=file:/app/data/gym.db
      - REDPILL_API_KEY=${REDPILL_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - TZ=Asia/Singapore
    restart: unless-stopped

volumes:
  gym-data:
